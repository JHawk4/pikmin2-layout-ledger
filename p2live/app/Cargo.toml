[package]
name = "p2live-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "Live Pikmin 2 layouts: the p2live detector on a camera or the OBS Virtual Camera, with a GUI and an OBS Browser Source"

# its own workspace, so it never joins a parent one
[workspace]

[[bin]]
name = "p2live-app"
path = "src/main.rs"

[dependencies]
p2live = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
# CaveGen3 draws the layouts; pinned so the app does not change under it
cavegen3-cli = { git = "https://github.com/JHawk4/CaveGen3", rev = "803830375accdcbf6e96ba9bd2beb0e45bb26e4b" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "accesskit", "links"] }
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
windows-core = "0.62"

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 2
