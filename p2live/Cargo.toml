[package]
name = "p2live"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pikmin 2 sublevel seeds from the falling cave-name letters (Rust port of p2seeds' detector)"

# its own workspace, so it never joins a parent one
[workspace]

[dependencies]
png = "0.17"
rustfft = "6"
realfft = "3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 2
