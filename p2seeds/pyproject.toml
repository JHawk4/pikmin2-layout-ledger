[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2seeds"
version = "0.1.0"
description = "Recover Pikmin 2 story-mode sublevel seeds from speedrun videos."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scipy>=1.11",
    "srcom-videos",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
p2seeds = "p2seeds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p2seeds = ["data/digits/*.png", "data/*.json", "data/panel/*"]
