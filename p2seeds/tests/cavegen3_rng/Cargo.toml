[package]
name = "cavegen3-rng-vectors"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fixed RNG sequences from CaveGen3, for p2seeds' rng.py parity test (test_rng_parity.py)"

# its own workspace, so it never joins a parent one
[workspace]

[dependencies]
# CaveGen3 is the source of truth for the game's RNG. Pinned; after moving the pin, regenerate
